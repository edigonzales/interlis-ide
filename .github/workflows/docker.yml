name: Build and publish browser container

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Browser container
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Resolve image metadata
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            echo "image_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "image_version=dev-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

          echo "image_source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/interlis-ide" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub secrets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${{ secrets.DOCKERHUB_USERNAME }}" || -z "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be configured for tag publishes." >&2
            exit 1
          fi

      - name: Extract publish metadata
        if: startsWith(github.ref, 'refs/tags/v')
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.vars.outputs.ghcr_image }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/interlis-ide
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=INTERLIS IDE
            org.opencontainers.image.description=Browser-based INTERLIS IDE built on Eclipse Theia

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build browser image for verification
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: browser.Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            OCI_IMAGE_SOURCE=${{ steps.vars.outputs.image_source }}
            OCI_IMAGE_REVISION=${{ github.sha }}
            OCI_IMAGE_VERSION=${{ steps.vars.outputs.image_version }}

      - name: Build and publish browser image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: browser.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OCI_IMAGE_SOURCE=${{ steps.vars.outputs.image_source }}
            OCI_IMAGE_REVISION=${{ github.sha }}
            OCI_IMAGE_VERSION=${{ steps.vars.outputs.image_version }}
