name: Build and publish browser container

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Browser container
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Resolve image metadata
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          ref_type="${GITHUB_REF_TYPE:-}"
          ref_name="${GITHUB_REF_NAME:-}"

          is_master_push=false
          is_release_tag=false
          is_publish=false

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/master" ]]; then
            is_master_push=true
            is_publish=true
          fi

          if [[ "${ref_type}" == "tag" && "${ref_name}" == v* ]]; then
            is_release_tag=true
            is_publish=true
            echo "image_version=${ref_name#v}" >> "$GITHUB_OUTPUT"
          else
            echo "image_version=dev-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

          echo "is_master_push=${is_master_push}" >> "$GITHUB_OUTPUT"
          echo "is_release_tag=${is_release_tag}" >> "$GITHUB_OUTPUT"
          echo "is_publish=${is_publish}" >> "$GITHUB_OUTPUT"
          echo "image_source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/interlis-ide" >> "$GITHUB_OUTPUT"
          echo "dockerhub_image=docker.io/edigonzales/interlis-ide" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: ${{ steps.vars.outputs.is_publish == 'true' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub secrets
        if: ${{ steps.vars.outputs.is_publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${{ secrets.DOCKERHUB_USERNAME }}" || -z "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be configured for image publishes." >&2
            exit 1
          fi

      - name: Extract publish metadata
        if: ${{ steps.vars.outputs.is_publish == 'true' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.vars.outputs.ghcr_image }}
            ${{ steps.vars.outputs.dockerhub_image }}
          tags: |
            type=raw,value=latest,enable=${{ steps.vars.outputs.is_master_push == 'true' }}
            type=semver,pattern={{version}},enable=${{ steps.vars.outputs.is_release_tag == 'true' }}
            type=raw,value=latest,enable=${{ steps.vars.outputs.is_release_tag == 'true' }}
          labels: |
            org.opencontainers.image.title=INTERLIS IDE
            org.opencontainers.image.description=Browser-based INTERLIS IDE built on Eclipse Theia

      - name: Log in to GitHub Container Registry
        if: ${{ steps.vars.outputs.is_publish == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ steps.vars.outputs.is_publish == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build browser image for verification
        if: ${{ steps.vars.outputs.is_publish != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: browser.Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            OCI_IMAGE_SOURCE=${{ steps.vars.outputs.image_source }}
            OCI_IMAGE_REVISION=${{ github.sha }}
            OCI_IMAGE_VERSION=${{ steps.vars.outputs.image_version }}

      - name: Build and publish browser image
        if: ${{ steps.vars.outputs.is_publish == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: browser.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OCI_IMAGE_SOURCE=${{ steps.vars.outputs.image_source }}
            OCI_IMAGE_REVISION=${{ github.sha }}
            OCI_IMAGE_VERSION=${{ steps.vars.outputs.image_version }}
